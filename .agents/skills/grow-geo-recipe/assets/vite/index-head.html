<!--
  Vite/React fallback head block. Paste into <head> in index.html.
  Replace BRAND, DOMAIN, and DESCRIPTION before shipping.

  Note: Vite/React projects without SSR can't pass JS-disabled crawler
  checks. For the Grow GEO Standard you really want TanStack Start (SSR).
  This template is the best you can do on a CSR-only stack.
-->

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brand — Tagline</title>
<meta name="description" content="150-char description that answers the page's implicit question. Numbers and entities." />

<link rel="canonical" href="https://DOMAIN/" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Brand" />
<meta property="og:title" content="Brand — Tagline" />
<meta property="og:description" content="Same as meta description, or share-optimized variant." />
<meta property="og:url" content="https://DOMAIN/" />
<!-- <meta property="og:image" content="https://DOMAIN/og.jpg" /> -->

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Brand — Tagline" />
<meta name="twitter:description" content="Same as meta description." />

<!-- Build stamp -->
<meta name="generator" content="geo-standard@2026.05" />

<!-- JSON-LD Organization -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Brand",
  "url": "https://DOMAIN",
  "logo": "https://DOMAIN/logo.png"
}
</script>
