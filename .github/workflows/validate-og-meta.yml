name: validate-og-meta

on:
  push:
    branches: [main]
    paths:
      - "src/routes/**"
      - "src/lib/seo/**"
      - "scripts/validate-og-meta.mjs"
      - "scripts/report-og-meta.mjs"
  pull_request:
    paths:
      - "src/routes/**"
      - "src/lib/seo/**"
      - "scripts/validate-og-meta.mjs"
      - "scripts/report-og-meta.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate per-route og:image / twitter:image meta
        run: node scripts/validate-og-meta.mjs
      - name: Generate og:image / twitter:image coverage report
        if: always()
        run: node scripts/report-og-meta.mjs
      - name: Publish report to job summary
        if: always()
        run: cat og-meta-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: og-meta-report
          path: |
            og-meta-report.md
            og-meta-report.json
          if-no-files-found: error
