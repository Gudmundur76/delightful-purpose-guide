<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Grow GEO Score</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0b0f;
        --fg: #f5f5f7;
        --muted: #8a8a93;
        --line: #1f1f27;
        --accent: #7cf5a4;
        --warn: #f5c97c;
        --bad: #f57c7c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 340px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header .brand { font-weight: 600; letter-spacing: -0.01em; }
      header .url { font-size: 11px; color: var(--muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      main { padding: 14px 16px 16px; }
      .score-wrap { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
      .score { font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
      .score.good { color: var(--accent); }
      .score.mid { color: var(--warn); }
      .score.bad { color: var(--bad); }
      .of { color: var(--muted); font-size: 14px; }
      .subs { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 10px 0 14px; font-size: 12px; }
      .subs .k { color: var(--muted); }
      .subs .v { text-align: right; font-variant-numeric: tabular-nums; }
      .fixes { border-top: 1px solid var(--line); padding-top: 10px; }
      .fixes h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
      .fixes ul { margin: 0; padding-left: 16px; }
      .fixes li { margin: 3px 0; }
      .cta {
        display: block;
        text-align: center;
        background: var(--fg);
        color: var(--bg);
        padding: 9px 12px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        margin-top: 12px;
      }
      .cta.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); margin-top: 6px; font-weight: 500; }
      .status { color: var(--muted); padding: 24px 0; text-align: center; }
      .err { color: var(--bad); padding: 16px 0; text-align: center; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">Grow GEO</div>
      <div class="url" id="url">—</div>
    </header>
    <main id="main">
      <div class="status">Scanning…</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
